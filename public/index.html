<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Trading Signals</title>
<meta name="theme-color" content="#0f172a" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  :root {
    --bg: #0b1220;
    --card: #131c2e;
    --card-border: #202b42;
    --text: #e6ebf5;
    --muted: #8996ad;
    --buy: #22c55e;
    --sell: #ef4444;
    --accent: #60a5fa;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  header {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    padding: 16px 16px 10px;
    border-bottom: 1px solid var(--card-border);
  }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  #status {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--muted); margin-top: 8px;
  }
  #status .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted);
  }
  #status.live .dot { background: var(--buy); }
  main { padding: 12px 16px 32px; max-width: 560px; margin: 0 auto; }
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .card .row1 {
    display: flex; align-items: center; justify-content: space-between;
  }
  .badge {
    font-weight: 700; font-size: 13px; letter-spacing: 0.03em;
    padding: 4px 10px; border-radius: 999px; color: #06110a;
  }
  .badge.BUY { background: var(--buy); }
  .badge.SELL { background: var(--sell); color: #1a0505; }
  .symbol { font-weight: 700; font-size: 16px; }
  .time { color: var(--muted); font-size: 12px; }
  .levels {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    margin-top: 12px;
  }
  .levels div { text-align: center; }
  .levels .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  .levels .v { font-size: 14px; font-weight: 600; margin-top: 2px; }
  .reason { margin-top: 10px; font-size: 13px; color: var(--muted); line-height: 1.4; }
  .empty { text-align: center; color: var(--muted); padding: 60px 20px; font-size: 14px; }

  /* First-run setup screen */
  #setup {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 10;
  }
  #setup .box { max-width: 360px; width: 100%; }
  #setup h2 { margin: 0 0 8px; }
  #setup p { color: var(--muted); font-size: 14px; line-height: 1.5; }
  #setup input {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--card-border);
    background: var(--card); color: var(--text); font-size: 15px; margin: 14px 0;
  }
  #setup button {
    width: 100%; padding: 13px; border-radius: 10px; border: none;
    background: var(--accent); color: #06111f; font-weight: 700; font-size: 15px;
  }
  #setup .err { color: var(--sell); font-size: 13px; min-height: 18px; margin-top: 6px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

  <div id="setup" class="hidden">
    <div class="box">
      <h2>Connect dashboard</h2>
      <p>Enter the API key you set on your signal server (the same one configured in the EA's <code>InpDashboardAPIKey</code> input).</p>
      <input id="apiKeyInput" type="password" placeholder="API key" autocomplete="off" />
      <button id="saveKeyBtn">Save &amp; connect</button>
      <div class="err" id="setupErr"></div>
    </div>
  </div>

  <header>
    <h1>Trading Signals</h1>
    <p>XAUUSD &middot; XAGUSD &mdash; EMA/RSI starter strategy</p>
    <div id="status"><span class="dot"></span><span id="statusText">connecting…</span></div>
  </header>

  <main id="feed">
    <div class="empty">Waiting for the first signal…</div>
  </main>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
